name: Codespaces Development CI

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/codespaces-dev-environment"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: codespaces-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile source
        run: python -m compileall -q bongo nexora tests

      - name: Run tests
        run: python -m pytest -q
